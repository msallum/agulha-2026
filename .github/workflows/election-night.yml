name: Election night

on:
  # Runoff night: 16:40 Brasília (19:40 UTC) on 25 Oct, with the defaults below (real results, round 2, live-data).
  # The script waits for polls to close at 17:05; the 6h job limit then runs to 22:40. Remove after the runoff (it
  # would fire again every 25 Oct).
  schedule:
    - cron: "40 19 25 10 *"
  workflow_dispatch:
    inputs:
      round:
        description: "Election round (1 = first round, 2 = runoff)"
        type: choice
        options: ["2", "1"]
        default: "2"
      use_simulado:
        description: "Poll TSE's rehearsal environment (simulado) instead of the real results"
        type: boolean
        default: false
      polls_close_time:
        description: "Polls-close reference time, America/Sao_Paulo, 'YYYY-MM-DD HH:MM:SS' (empty = script default)"
        required: false
        default: ""
      max_iterations:
        description: "Stop after this many cycles (empty = until the count completes or the 6h job limit)"
        required: false
        default: ""
      election_code:
        description: "TSE election code (empty = discover it; the simulado's runoff rehearsal is 22410)"
        required: false
        default: ""
      lula_name:
        description: "Ballot name counted as Lula (empty = LULA; rehearsals use fictional names, e.g. CAND PRES 52)"
        required: false
        default: ""
      bolsonaro_name:
        description: "Ballot name counted as Bolsonaro (empty = FLAVIO BOLSONARO; e.g. CAND PRES 56 in rehearsals)"
        required: false
        default: ""
      data_branch:
        description: "Branch the results are pushed to; only live-data feeds the site (use live-data-test for tests)"
        required: false
        default: "live-data"

permissions:
  contents: write
  actions: write

concurrency:
  group: election-night
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.data_branch || 'live-data' }}
          path: live-data
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        run: Rscript -e 'install.packages(c("tidyverse", "jsonlite", "curl"))'
      - name: Install Python packages (section model)
        run: pip install numpy pandas
      - name: Poll TSE and publish after every cycle
        env:
          GH_TOKEN: ${{ github.token }}
          ROUND: ${{ inputs.round || '2' }}
          USE_SIMULADO: ${{ inputs.use_simulado && 'TRUE' || 'FALSE' }}
          POST_CYCLE_CMD: bash scripts/publish.sh
          DATA_DIR: live-data
          DATA_BRANCH: ${{ inputs.data_branch || 'live-data' }}
          N_BOOT: "60"
          INPUT_ELECTION_CODE: ${{ inputs.election_code }}
          INPUT_LULA_NAME: ${{ inputs.lula_name }}
          INPUT_BOLSONARO_NAME: ${{ inputs.bolsonaro_name }}
          INPUT_POLLS_CLOSE: ${{ inputs.polls_close_time }}
          INPUT_MAX_ITER: ${{ inputs.max_iterations }}
        run: |
          if [ -n "$INPUT_POLLS_CLOSE" ]; then export POLLS_CLOSE_TIME="$INPUT_POLLS_CLOSE"; fi
          if [ -n "$INPUT_MAX_ITER" ]; then export MAX_ITERATIONS="$INPUT_MAX_ITER"; fi
          if [ -n "$INPUT_ELECTION_CODE" ]; then export ELECTION_CODE="$INPUT_ELECTION_CODE"; fi
          if [ -n "$INPUT_LULA_NAME" ]; then export LULA_URNA_NAME="$INPUT_LULA_NAME"; fi
          if [ -n "$INPUT_BOLSONARO_NAME" ]; then export BOLSONARO_URNA_NAME="$INPUT_BOLSONARO_NAME"; fi
          Rscript run_polling_schedule.R
      - name: Report each cycle as an annotation
        if: always()
        run: |
          if [ ! -f polling_schedule_log.csv ]; then echo "::warning::no polling log was written"; exit 0; fi
          python3 - <<'PY'
          import csv
          for r in csv.DictReader(open("polling_schedule_log.csv")):
              level = "notice" if r["status"] == "ok" else "error"
              print(f"::{level} title=cycle {r['timestamp']}::{r['status']} | counted {r['frac_votes_counted']} | {r['note']}")
          PY
